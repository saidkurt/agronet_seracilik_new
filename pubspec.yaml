name: agronet
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+49

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.6.0 # :contentReference[oaicite:2]{index=2}
  dio: ^5.9.1 # :contentReference[oaicite:3]{index=3}


  # UI / Animations
  cupertino_icons: ^1.0.8
  animations: ^2.1.1 # :contentReference[oaicite:4]{index=4}
  flutter_slidable: ^4.0.3 # :contentReference[oaicite:5]{index=5}
  flutter_spinkit: ^5.2.2 # :contentReference[oaicite:6]{index=6}
  introduction_screen: ^4.0.0
  grouped_list: ^6.0.0 # :contentReference[oaicite:8]{index=8}

  # Loading (progress_dialog yerine)
  flutter_easyloading: ^3.0.5 # :contentReference[oaicite:9]{index=9}

  # Date / Time
  intl: ^0.20.2 # :contentReference[oaicite:10]{index=10}
  jiffy: ^6.4.4 # :contentReference[oaicite:11]{index=11}

  # Date range picker (date_range_picker yerine)
  flutter_date_range_picker: ^0.2.1 # :contentReference[oaicite:12]{index=12}

  # Datetime picker (flutter_datetime_picker yerine)
  flutter_datetime_picker_plus: ^2.2.0 # :contentReference[oaicite:13]{index=13}

  # Storage
  shared_preferences: ^2.5.4


  fl_chart: ^0.68.0



  # Crypto
  crypto: ^3.0.7 # :contentReference[oaicite:15]{index=15}

  # Charts (Syncfusion - lisans gerektiğini unutma)
  syncfusion_flutter_charts: ^32.1.25 # :contentReference[oaicite:16]{index=16}
  mobile_scanner: ^7.1.4
  flutter_native_splash: ^2.4.7
  flutter_localization: ^0.3.3
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0
  path_provider: ^2.1.5
  onesignal_flutter: ^5.6.7
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icon generator (dependencies değil dev_dependencies olmalı)
  flutter_launcher_icons: ^0.14.4 # :contentReference[oaicite:17]{index=17}

flutter:
  uses-material-design: true

  assets:
    - assets/agronet.png
    - assets/1234.png


  fonts:
    - family: Montserrat
      fonts:
        - asset: font/Montserrat-Regular.ttf
          weight: 400
        - asset: font/Montserrat-Regular.ttf
          weight: 700

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/1234.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/1234.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/1234.png"    